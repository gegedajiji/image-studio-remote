services:
  mysql:
    image: mysql:8.4
    container_name: mirage-workstation-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: mirage
      MYSQL_USER: mirage
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-p${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  migrate:
    build:
      context: .
      target: build
    env_file: .env
    command: sh -c "pnpm run db:push && pnpm exec tsx db/seed.ts"
    depends_on:
      mysql:
        condition: service_healthy

  app:
    build:
      context: .
    image: mirage-workstation:latest
    container_name: mirage-workstation
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "127.0.0.1:8791:3000"
    volumes:
      - generated_data:/app/data/generated
      - avatar_data:/app/data/avatars
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - default
      - gateway
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  mysql_data:
  generated_data:
  avatar_data:

networks:
  gateway:
    external: true
    name: new-api_newapi
