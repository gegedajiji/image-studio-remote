services:
  image-studio:
    build:
      context: .
      dockerfile: Dockerfile
    image: youyu-image-studio:latest
    container_name: youyu-image-studio
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 8790
    ports:
      - "127.0.0.1:8790:8790"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:' + (process.env.PORT || 8790) + '/api/health').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Optional MySQL service. If enabled, also set STORE_DRIVER=mysql and MYSQL_* in .env.
