name: mirage-image

services:
  mysql:
    image: mysql:8.4
    container_name: mirage-image-mysql
    restart: unless-stopped
    env_file: ../../.env
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  migrate:
    build:
      context: ../..
      target: build
    env_file: ../../.env
    command: sh -c "pnpm run db:push && pnpm exec tsx db/seed.ts"
    depends_on:
      mysql:
        condition: service_healthy

  app:
    build:
      context: ../..
    image: mirage-image:latest
    container_name: mirage-image-app
    restart: unless-stopped
    env_file: ../../.env
    environment:
      NODE_ENV: production
      PORT: 3000
    volumes:
      - generated_data:/app/data/generated
      - avatar_data:/app/data/avatars
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s

  caddy:
    image: caddy:2.10-alpine
    container_name: mirage-image-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  mysql_data:
  generated_data:
  avatar_data:
  caddy_data:
  caddy_config:
